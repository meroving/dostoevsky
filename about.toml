# cargo about generate (dsky-a8n.3): the license texts of every crate in the macOS app, shipped
# in the bundle as THIRD-PARTY-LICENSES.txt (scripts/bundle.sh). Same allow list as deny.toml.
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin"]
ignore-dev-dependencies = true
ignore-build-dependencies = true
accepted = [
  "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "MIT", "BSD-2-Clause", "BSD-3-Clause", "ISC",
  "Zlib", "0BSD", "Unlicense", "CC0-1.0", "BSL-1.0", "Unicode-3.0", "CDLA-Permissive-2.0", "MPL-2.0",
]
