# cargo about generate (dsky-a8n.3): the license texts of every crate in the app, shipped as
# THIRD-PARTY-LICENSES.txt in the Mac bundle, the AppImage and the Windows installer
# (scripts/bundle.sh, appimage.sh, msi.sh): one file for every system's crates. Same allow list as deny.toml.
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
ignore-dev-dependencies = true
ignore-build-dependencies = true
accepted = [
  "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "MIT", "BSD-2-Clause", "BSD-3-Clause", "ISC",
  "Zlib", "0BSD", "Unlicense", "CC0-1.0", "BSL-1.0", "Unicode-3.0", "CDLA-Permissive-2.0", "MPL-2.0",
]
