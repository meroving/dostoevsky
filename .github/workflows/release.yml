# Manual only: Actions → Release → Run workflow, with a vX.Y.Z tag that's already pushed → a
# universal .dmg signed with the Developer ID, notarized and stapled, attached to a draft GitHub
# Release (dsky-a8n.10, docs/RELEASE.md §4 and §5), and beside it the Windows .msi (dsky-fbso.14),
# with the update check. Look the draft over, then publish it; the Homebrew cask for that .dmg is
# in the run's summary. The .dmg is usually built locally (docs/RELEASE.md §4): then run this with
# "Only Windows" once the release exists, and it adds the .msi to it. Pushing a tag runs nothing.
# The Linux AppImage (scripts/appimage.sh) isn't released yet: ci.yml builds and tries it until it is.
#
# Repository secrets (NEEDS OWNER):
#   DEVELOPER_ID_P12           base64 of a .p12 with the "Developer ID Application" certificate and its key
#   DEVELOPER_ID_P12_PASSWORD  that .p12's password
#   ASC_KEY_ID, ASC_ISSUER_ID  an Apple API key used for notarytool
#   ASC_KEY_P8                 the key's .p8, as text
name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'The release tag, already pushed (vX.Y.Z)'
        required: true
      windows_only:
        description: 'Only Windows: the release and its .dmg already exist'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag }}

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag }}

jobs:
  dmg:
    if: ${{ !inputs.windows_only }}
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0   # bundle.sh's build number is the commit count

      - name: The tag matches Cargo.toml
        run: |
          v="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          [ "v$v" = "$TAG" ] || { echo "::error::tag $TAG, Cargo.toml says $v"; exit 1; }
          echo "VERSION=$v" >> "$GITHUB_ENV"

      - name: Rust toolchain (rust-toolchain.toml), both architectures
        run: |
          rustup toolchain install
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: cargo-about (third-party licenses in the bundle)
        run: brew install cargo-about

      - name: The Developer ID certificate in a throwaway keychain
        env:
          P12: ${{ secrets.DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          SECRETS="$PWD/target/secrets"
          KC="$SECRETS/release.keychain-db"
          PW="$(uuidgen)"
          mkdir -p "$SECRETS"
          security create-keychain -p "$PW" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$PW" "$KC"
          printf '%s' "$P12" | base64 --decode > "$SECRETS/id.p12"
          security import "$SECRETS/id.p12" -k "$KC" -P "$P12_PASSWORD" -T /usr/bin/codesign
          rm -f "$SECRETS/id.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$PW" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user)
          id="$(security find-identity -v -p codesigning "$KC" | sed -n 's/.*"\(Developer ID Application: [^"]*\)".*/\1/p' | head -1)"
          [ -n "$id" ] || { echo "::error::no Developer ID Application identity in DEVELOPER_ID_P12"; exit 1; }
          echo "SIGN_IDENTITY=$id" >> "$GITHUB_ENV"

      - name: Build, sign, notarize, staple
        env:
          NOTARY_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          NOTARY_KEY="$PWD/target/secrets/AuthKey_$NOTARY_KEY_ID.p8"
          mkdir -p "$PWD/target/secrets"
          printf '%s\n' "$ASC_KEY_P8" > "$NOTARY_KEY"
          scripts/bundle.sh
          rm -f "$NOTARY_KEY"

      - name: Universal, Developer ID, notarized; no private API
        run: |
          APP=target/bundle/Dostoevsky.app
          lipo -archs "$APP/Contents/MacOS/dostoevsky" | grep -qw x86_64
          lipo -archs "$APP/Contents/MacOS/dostoevsky" | grep -qw arm64
          spctl --assess -vv "$APP"
          xcrun stapler validate "target/bundle/Dostoevsky-$VERSION.dmg"
          scripts/check_private_api.sh "$APP/Contents/MacOS/dostoevsky"

      - name: Draft release with the .dmg
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" "target/bundle/Dostoevsky-$VERSION.dmg" \
            --draft --verify-tag --title "Dostoevsky $VERSION" --generate-notes

      - name: Homebrew cask for the tap
        run: |
          { echo '### Homebrew cask (Casks/dostoevsky.rb in meroving/homebrew-tap)'; echo '```ruby'
            scripts/cask.sh "target/bundle/Dostoevsky-$VERSION.dmg"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove signing material
        if: always()
        run: |
          security delete-keychain "$PWD/target/secrets/release.keychain-db" 2>/dev/null || true
          rm -rf "$PWD/target/secrets"

  msi:
    needs: dmg
    if: ${{ always() && (needs.dmg.result == 'success' || needs.dmg.result == 'skipped') }}
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout as the repository has it (LF)
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}

      - name: The tag matches Cargo.toml
        run: |
          v="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          [ "v$v" = "$TAG" ] || { echo "::error::tag $TAG, Cargo.toml says $v"; exit 1; }

      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about

      - name: WiX
        run: |
          dotnet tool install --global wix --version 5.0.2
          echo "$USERPROFILE/.dotnet/tools" >> "$GITHUB_PATH"

      - name: The .msi, with the update check (not signed yet)
        run: UPDATES=1 scripts/msi.sh

      - name: Attach it to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" target/bundle/Dostoevsky-*-x64.msi --clobber
