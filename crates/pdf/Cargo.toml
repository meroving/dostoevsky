[package]
name = "pdf"
description = "Pages of the final text as a PDF and as bitmaps, without a UI or a system text engine (no UI)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
export = { path = "../export" }
ttf-parser = "0.25"
rustybuzz = "0.20"
unicode-linebreak = "0.1"
unicode-script = "0.5"
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd"] }
pdf-writer = "0.15"
subsetter = "0.2"
miniz_oxide = "0.8"
