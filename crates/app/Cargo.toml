[package]
name = "dostoevsky"
description = "The Dostoevsky app: windows, page element, sidebar, overflow, menus (gpui-kit)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
default-run = "dostoevsky"

[dependencies]
l10n = { path = "../l10n" }
doc-model = { path = "../doc-model" }
doc-format = { path = "../doc-format" }
export = { path = "../export" }
# The page composition, and off the Mac the engine that sets and draws the pages.
pdf = { path = "../pdf" }
ai = { path = "../ai" }
english = { path = "../english" }
prose = { path = "../prose" }
gpui-kit = { version = "=0.8.0", default-features = false, features = ["assets"] }
unicode-segmentation = "1"
# Hyphenation off the Mac: TeX's patterns for the languages the app reads (hyphen.rs).
hypher = { version = "0.1", default-features = false, features = ["alloc", "english", "russian", "german", "french", "spanish", "italian", "portuguese"] }
# Spelling off the Mac: Hunspell dictionaries (pure Rust), read in the encoding they name.
spellbook = "0.4"
encoding_rs = "0.8"
rodio = { version = "0.21", default-features = false, features = ["playback"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"
notify = "8"
smol = "2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# Export's preview pages (RenderImage frames); PNG only for the dev screenshots.
image = { version = "0.25", default-features = false }
# The .dmg build's update check (updates.rs); the same ureq the AI client uses.
ureq = { version = "3", default-features = false, features = ["rustls"], optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSWorkspace", "NSSound", "NSAccessibility", "NSSpellChecker", "NSView", "NSResponder", "NSWindow", "NSPanel", "NSSavePanel", "NSOpenPanel", "NSApplication", "NSColor", "NSColorPanel", "NSColorSpace", "block2"] }
objc2-foundation = { version = "0.3", features = ["NSUserDefaults", "NSValue", "NSString", "NSArray", "NSRange", "NSGeometry", "NSAttributedString", "NSFileManager", "NSURL", "NSData", "NSError", "NSPathUtilities", "NSTextCheckingResult", "NSOrthography", "NSDictionary", "NSDate", "NSDateFormatter", "NSFormatter", "NSLocale", "NSCalendar", "NSTimeZone"] }
raw-window-handle = "0.6"
# Export: TextKit pages into a PDF, its preview and Print (pdf.rs).
objc2-core-foundation = "0.3"
objc2-core-graphics = "0.3"
objc2-core-text = "0.3"
objc2-pdf-kit = "0.3"

# The freedesktop.org Trash's other-disk folder is named by the user's id (trash.rs).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Print on Linux: the print portal (pdf.rs, dsky-fbso.16), the ashpd GPUI's Linux platform already
# links, with its Print interface.
[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13", default-features = false, features = ["async-io", "print"] }

# Dates off the Mac: CLDR's patterns and names in each language (dates.rs; dsky-fbso.15).
[target.'cfg(not(target_os = "macos"))'.dependencies]
icu_datetime = "2.4"
icu_calendar = "2.4"
icu_locale_core = "2.4"
writeable = "0.6"
# Formatted text on the clipboard off the Mac: Windows' HTML Format, X11's text/html (clipboard.rs).
arboard = { version = "3", default-features = false }

# Windows' own spell checker (win_spell.rs, dsky-fbso.17), Recycle Bin, animation setting and
# UI languages (recycle_bin.rs, platform.rs; dsky-fbso.7), the pipe other launches hand their
# files to (instance.rs, dsky-fbso.20) and the shell's print verb (pdf.rs, dsky-fbso.16); the
# version GPUI's Windows platform already links.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_Registry", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging"] }
# Its #[implement] macro names windows_core: the Recycle Bin's progress sink (recycle_bin.rs).
windows-core = "0.62"
# A window's HWND, to bring it to the front without GPUI's pressed Alt (platform.rs).
raw-window-handle = "0.6"

# Screenshot comparison for scripts/run_flows.sh (visual regression, dsky-65y.19).
[[bin]]
name = "imgdiff"
path = "src/bin/imgdiff.rs"
required-features = ["shots"]

# The .exe's icon, name and version (build.rs).
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[features]
# Scripted screenshots for development: DOSTOEVSKY_SCRIPT=steps.jsonl (see src/shots.rs).
shots = ["gpui-kit/test-support", "image/png"]
# The .dmg build checks dostoevsky.app/version.json (updates.rs); the App Store build leaves it out.
updates = ["dep:ureq"]

[dev-dependencies]
gpui-kit = { version = "=0.8.0", default-features = false, features = ["assets", "test-support"] }

# The CoreText text system on its own (the full Mac platform needs the main thread), so
# headless UI tests shape text exactly like the app (src/ui_tests).
[target.'cfg(target_os = "macos")'.dev-dependencies]
gpui-pre-apple = "=0.3.9"
# The Mac's tests hold ICU4X's dates (the other systems') against NSDateFormatter's.
icu_datetime = "2.4"
icu_calendar = "2.4"
icu_locale_core = "2.4"
writeable = "0.6"

# Off the Mac, the cosmic-text system GPUI's Linux and Windows platforms shape with (dsky-fbso.12).
[target.'cfg(not(target_os = "macos"))'.dev-dependencies]
gpui-pre-wgpu = "=0.3.9"
